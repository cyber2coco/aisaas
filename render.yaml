services:
  - type: web
    name: zhimei-ai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: QWEN_API_KEY
        value: ""
    healthCheckPath: /api/auth/models
    autoDeploy: true
